[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "volta-analytics"
version = "0.1.0"
description = "Local and remote analytics for Volta metrics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "psycopg[binary]>=3.1",
  "typer>=0.12",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
volta-analytics = "volta_analytics.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/volta_analytics"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
