core_affinity = [2, "3-10"]

# Supported levels: trace/noisy, debug, info, warning, error
log_level = "info"
# If omitted, logs are written to stderr.
# log_file = "/var/log/volta/agent.log"

# Collect CPU and GPU power metrics
metrics = [
  "METRIC_TYPE_CPU_POWER_PACKAGE",
  "METRIC_TYPE_GPU_POWER",
]
