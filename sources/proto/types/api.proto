syntax = "proto3";

package volta;

import "google/protobuf/timestamp.proto";

option go_package = "server/pb/types;types";

message ListAgentsResponse {
  repeated Agent agents = 1;
}

message Agent {
  string id = 1;
  string address = 2;
  google.protobuf.Timestamp connected_at = 3;
  AgentStatus status = 4;
}

enum AgentStatus {
  UNKNOWN = 0;
  CONNECTED = 1;
  DISCONNECTED = 2;
  STREAMING = 3;
}